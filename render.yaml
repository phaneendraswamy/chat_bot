services:
  - type: web
    name: ai-engineer-portfolio
    env: python
    buildCommand: "pip install -r requirements.txt && python build_vectordb.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: CHROMA_PERSIST_DIR
        value: /tmp/personal_vectordb
      - key: APP_ENV
        value: production
